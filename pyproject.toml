[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papertrail"
version = "0.1.1"
description = "Number-level provenance from experiment runs to manuscript, with stale/orphan detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Anandharajan TRV", email = "trvanandharajan@gmail.com" }]
dependencies = [
  "pydantic>=2",
  "numpy",
  "scipy",
  "pyyaml"
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
mlflow = ["mlflow-skinny>=2.10", "sqlalchemy", "alembic"]
wandb = ["wandb>=0.17"]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov", "ruff", "mypy"]

[project.scripts]
papertrail = "papertrail.cli:main"
papertrail-mcp = "papertrail.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]
ignore = ["B905", "B007", "E702"]
